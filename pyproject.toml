[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-kernels"
version = "0.1.0"
description = "Triton kernels for LLM inference (RMSNorm, decode attention, GEMM) benchmarked against FlashInfer in tritonbench"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "triton>=3.0"]

[project.optional-dependencies]
bench = ["flashinfer-python", "liger-kernel", "matplotlib", "pytest"]

[tool.setuptools]
packages = ["llm_kernels"]
